<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartKids — Зворотний зв'язок</title>

    <!-- Підключення зовнішньої таблиці стилів -->
    <link rel="stylesheet" href="style.css">

    <!-- Внутрішня таблиця стилів (Вимога Лаб 2) -->
    <style>
        /* Локальні стилі для сторінки зворотного зв'язку */
        body {
            padding-top: 110px;
        }
    </style>
</head>

<body>

    <!-- Шапка сайту з єдиним навігаційним меню -->
    <header id="main-header">
        <div class="logo-container">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' width='80' height='80'><circle cx='50' cy='50' r='48' fill='%23FF6B6B'/><circle cx='50' cy='50' r='38' fill='%234ECDC4'/><text x='50' y='58' font-family='Arial' font-size='14' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>SmartKids</text></svg>"
                alt="Логотип SmartKids" width="50" height="50">
            <span class="portal-title">SmartKids</span>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="courses.html">Наші курси</a></li>
                <li><a href="feedback.html">Зворотний зв'язок</a></li>
            </ul>
        </nav>
    </header>

    <!-- Головна обгортка сторінки на Flexbox -->
    <main class="container flex-feedback-wrapper">

        <div class="feedback-form-container">
            <h2>Форма зворотного зв’язку SmartKids</h2>
            <p>Будь ласка, заповніть форму нижче, щоб надіслати нам ваші запитання або пропозиції.</p>
            <br>

            <form action="#" method="post" class="flex-form">

                <!-- Група 1: Персональна інформація -->
                <fieldset class="form-fieldset">
                    <legend><b>Персональна інформація</b></legend>

                    <div class="form-group">
                        <label for="parent_name">Прізвище та ім’я батьків:</label>
                        <input type="text" id="parent_name" name="parent_name" placeholder="Іваненко Олена" required>
                    </div>

                    <div class="form-group">
                        <label for="parent_email">E-mail батьків:</label>
                        <input type="email" id="parent_email" name="parent_email" placeholder="example@mail.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="child_age">Вік дитини (років):</label>
                        <input type="number" id="child_age" name="child_age" min="2" max="12" placeholder="6" required>
                    </div>

                    <div class="form-group">
                        <label>Стать дитини:</label>
                        <div class="radio-group">
                            <label><input type="radio" id="boy" name="child_gender" value="хлопчик" checked>
                                Хлопчик</label>
                            <label><input type="radio" id="girl" name="child_gender" value="дівчинка"> Дівчинка</label>
                        </div>
                    </div>
                </fieldset>

                <!-- Група 2: Деталі звернення -->
                <fieldset class="form-fieldset">
                    <legend><b>Деталі звернення</b></legend>

                    <div class="form-group">
                        <label for="goal">Мета зворотного зв’язку:</label>
                        <select name="goal" id="goal" required>
                            <option value="cooperation">Співпраця</option>
                            <option value="complaint">Скарга на неякісний контент</option>
                            <option value="suggestion">Пропозиція</option>
                            <option value="bug">Наявність помилки</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="details">Детально (максимум 500 символів):</label>
                        <textarea id="details" name="details" rows="5" maxlength="500"
                            placeholder="Введіть ваш коментар тут..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="consent" name="consent" required>
                        <label for="consent">Я даю згоду на обробку моїх персональних даних</label>
                    </div>
                </fieldset>

                <!-- Кнопки керування формою з Flex-позиціонуванням -->
                <div class="form-actions">
                    <button type="reset" class="btn-action btn-reset">Очистити форму</button>
                    <button type="submit" class="btn-action">Надіслати інформацію</button>
                </div>
            </form>
        </div>

        <div class="back-link-wrapper">
            <a href="index.html" class="btn-back">&larr; Перейти на Головну сторінку</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 SmartKids Educational Portal</p>
    </footer>

</body>

</html>
